name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

env:
  GO_VERSION: '1.27.4'
  GOVULNCHECK_VERSION: 'v1.9.0'
  GOWORK: 'off'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Prepara la matriz de módulos a validar.
  #
  # Lógica de scope:
  #   PR → dev  : solo los módulos con archivos modificados en el PR
  #               (si cambian scripts/, Makefile o .github/ → todos)
  #   PR → main : todos los módulos (máxima seguridad antes de merge)
  #   push main : todos los módulos
  # ──────────────────────────────────────────────────────────────
  prepare-modules:
    name: Prepare Module Matrix
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.scope.outputs.target }}
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determinar modulos objetivo
        id: scope
        run: |
          ALL_JSON=$(./scripts/list-modules.sh --set all --format json)

          # Solo para PRs a dev aplicamos el filtro de módulos modificados
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "dev" ]]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

            # Si cambian archivos globales, correr todos los módulos
            if echo "$CHANGED" | grep -qE "^(Makefile|scripts/|\.github/)"; then
              echo "Cambios globales detectados → corriendo todos los módulos"
              echo "target=$ALL_JSON" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ALL_MODULES=$(./scripts/list-modules.sh --set all)
            HITS=()
            while IFS= read -r m; do
              if echo "$CHANGED" | grep -q "^${m}/"; then
                HITS+=("\"$m\"")
              fi
            done <<< "$ALL_MODULES"

            if [ ${#HITS[@]} -eq 0 ]; then
              echo "Sin módulos con cambios detectados → corriendo todos como fallback"
              echo "target=$ALL_JSON" >> "$GITHUB_OUTPUT"
            else
              TARGET="[$(IFS=,; echo "${HITS[*]}")]"
              echo "Módulos con cambios: $TARGET"
              echo "target=$TARGET" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "target=$ALL_JSON" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────
  # Optimizaciones aplicadas respecto al pipeline anterior:
  #
  #   1. test + lint unificados en un solo job por módulo
  #      → elimina el doble overhead de checkout/setup-go/mod-download
  #
  #   2. Solo módulos modificados para PRs a dev (ver prepare-modules)
  #      → PRs cotidianas validan solo lo necesario
  #
  #   3. Cache de go mod compartido dentro del mismo job
  #      → go mod download se ejecuta una sola vez por módulo/runner
  #
  #   4. go build eliminado (go test ya compila; golangci-lint también)
  # ──────────────────────────────────────────────────────────────
  validate:
    name: Validate ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: prepare-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.prepare-modules.outputs.target) }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Descargar dependencias
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Verificar formato
        working-directory: ${{ matrix.module }}
        run: |
          if ! gofmt -l . | grep -q .; then
            echo "Codigo formateado correctamente"
          else
            echo "Codigo no esta formateado:"
            gofmt -l .
            exit 1
          fi

      - name: Analisis estatico (go vet)
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # Segunda pasada: los ficheros //go:build integration solo se compilan con el tag.
      - name: Analisis estatico (go vet -tags integration)
        working-directory: ${{ matrix.module }}
        run: go vet -tags integration ./...

      - name: Ejecutar tests con race detection
        working-directory: ${{ matrix.module }}
        run: go test -short -v -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

      # Sin continue-on-error: una vulnerabilidad alcanzable pone el job en rojo (plan 054, H.2).
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ──────────────────────────────────────────────────────────────
  # Tests con Docker que NO llevan build tag (plan 054, S.6).
  #
  # Esto NO es la integracion: los ficheros //go:build integration no corren en CI, por decision
  # del dueño (2026-11-14). La integracion es gate local obligatorio: `make test-integration`.
  #
  # Lo que corre aqui es lo unico que `validate` no cubre: los tests sin tag que se saltan con
  # `-short` (testing.Short()) porque levantan containers con testcontainers. Medido el
  # 2026-11-14: 5 en testing (containers/manager_test.go) y 2 en database/postgres
  # (transaction_test.go). bootstrap, database/mongodb y messaging/rabbit no tienen ninguno:
  # alli este job repetia los tests unitarios de `validate`, y por eso salieron de la matriz.
  # Si un modulo gana un test asi, se añade a mano a esta lista.
  # ──────────────────────────────────────────────────────────────
  docker-untagged:
    name: Docker tests sin tag ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [testing, database/postgres]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Descargar dependencias
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Ejecutar tests con Docker sin tag (sin -short)
        working-directory: ${{ matrix.module }}
        run: go test -v -race -count=1 -timeout 10m ./...
