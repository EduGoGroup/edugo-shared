# .golangci.yml
version: "2"

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true
  # Con el tag, lint ve los ficheros //go:build integration (plan 054, S.6; bug 0024).
  # Ojo: con el tag puesto, un fichero //go:build !integration dejaria de lintarse, y --build-tags
  # en la linea de comandos no quita el tag de aqui. Por eso no hay ninguno en el repo: no crear.
  build-tags:
    - integration

linters:
  enable:
    # Defectos (habilitados por defecto)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Estilo
    - nakedret

    # Performance
    - prealloc

    # Seguridad
    - gosec

    # Complejidad
    - gocyclo
    - gocritic

    # Documentación
    - revive

    # Errores
    - errorlint
    - errname

    # Buenas prácticas
    - contextcheck
    - nilerr
    - nilnil

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        # Permitir ignorar errores en tests para setup/teardown
        - (io.Closer).Close

    gocyclo:
      min-complexity: 15

    revive:
      rules:
        - name: exported
          severity: warning
        - name: blank-imports
          severity: warning
        - name: context-as-argument
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # 0 = sin recorte: con el limite por defecto, lint calla los hallazgos repetidos (plan 054, S.4/S.6).
  max-issues-per-linter: 0
  max-same-issues: 0
